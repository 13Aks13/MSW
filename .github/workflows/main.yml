name: AI PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Code Review
        uses: KonstZiv/ai-code-reviewer@v1
        with:
          github_token: ${{ secrets.BOT_PAT }} # Використовуємо токен другого акаунта
          google_api_key: ${{ secrets.GEMINI_API_KEY }}
          llm_provider: gemini
          gemini_model: gemini-2.0-flash
          llm_fallback_provider: gemini
          mistral_api_key: "placeholder_key_12345"

      - name: Auto-approve PR
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          gh pr review ${{ github.event.pull_request.html_url }} --approve -b "AI Code Review passed. Auto-approved."
